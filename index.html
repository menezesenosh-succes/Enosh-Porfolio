      ';</' + 'script>';

    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.

        const m = MARKER.exec(el.getAttribute('src') || '');

        if (typeof text === 'string') {

        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];

      const s = document.createElement('script');

      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,

;\">\n        <p style=\"margin:0; font-size:0.75rem; letter-spacing:0.14em; color:rgba(255,255,255,0.55);\">ENOSH GODWIN MENEZES — BENGALURU, INDIA<\u002Fp>\n        <p style=\"margin:0; font-size:0.75rem; letter-spacing:0.14em; color:rgba(255,255,255,0.55); font-variant-numeric:tabular-nums;\">© 2026<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showPreloader&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;customCursor&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Motion&quot;}}\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    let tries = 0;\n    this._poll = setInterval(() => {\n      tries++;\n      if ((window.gsap && window.ScrollTrigger) || tries > 150) {\n        clearInterval(this._poll);\n        if (window.gsap && window.ScrollTrigger) this.init();\n        else this.staticFallback();\n      }\n    }, 40);\n  }\n  componentWillUnmount() {\n    clearInterval(this._poll);\n    if (this._lenis) this._lenis.destroy();\n    if (window.ScrollTrigger) window.ScrollTrigger.getAll().forEach(t => t.kill());\n    if (this._raf) cancelAnimationFrame(this._raf);\n  }\n  staticFallback() {\n    const p = document.getElementById('preloader');\n    if (p) p.style.display = 'none';\n  }\n  q(sel) { return Array.from(document.querySelectorAll(sel)); }\n  init() {\n    const gsap = window.gsap, ST = window.ScrollTrigger;\n    gsap.registerPlugin(ST);\n    const EASE = 'expo.out'; // ~cubic-bezier(0.16,1,0.3,1)\n    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    const touch = window.matchMedia('(hover: none)').matches;\n    const mobile = window.matchMedia('(max-width: 900px)').matches;\n\n    if (reduce) { this.staticFallback(); this.initReduced(); return; }\n\n    if (window.Lenis && !touch) {\n      this._lenis = new window.Lenis({ lerp: 0.1 });\n      this._lenis.on('scroll', ST.update);\n      gsap.ticker.add(t => this._lenis.raf(t * 1000));\n      gsap.ticker.lagSmoothing(0);\n    }\n\n    // split hero name into chars\n    this.q('[data-chars]').forEach(el => {\n      const text = el.textContent;\n      el.textContent = '';\n      text.split('').forEach(ch => {\n        const s = document.createElement('span');\n        s.style.display = 'inline-block';\n        s.style.whiteSpace = 'pre';\n        s.textContent = ch;\n        el.appendChild(s);\n      });\n    });\n    const chars = this.q('[data-chars] span');\n    gsap.set(chars, { yPercent: 110, rotateX: -35 });\n    gsap.set('#heroSub > *', { y: 40, opacity: 0 });\n    gsap.set('[data-eyebrow-rule]', { scaleX: 0 });\n    const curve = document.getElementById('curvePath');\n    let curveLen = 0;\n    if (curve) { curveLen = curve.getTotalLength(); curve.style.strokeDasharray = curveLen; curve.style.strokeDashoffset = curveLen; }\n    gsap.set('.curveNode', { scale: 0, transformOrigin: 'center center' });\n\n    // hero timeline (played after preloader)\n    const heroTl = gsap.timeline({ paused: true });\n    heroTl.to(chars, { yPercent: 0, rotateX: 0, duration: 0.9, ease: EASE, stagger: 0.045 }, 0)\n      .to('#heroSub > *', { y: 0, opacity: 1, duration: 0.9, ease: EASE, stagger: 0.08 }, 0.4)\n      .to('#hero [data-eyebrow-rule]', { scaleX: 1, duration: 0.9, ease: EASE }, 0.3);\n    if (curve) heroTl.to(curve, { strokeDashoffset: 0, duration: 2.2, ease: 'power2.inOut' }, 0.2)\n      .to('.curveNode', { scale: 1, duration: 0.6, ease: 'back.out(3)', stagger: 0.25 }, 1.1);\n\n    // preloader\n    const pre = document.getElementById('preloader');\n    const showPre = (this.props.showPreloader ?? true) && !this._preDone;\n    if (pre && showPre) {\n      this._preDone = true;\n      const cnt = { v: 0 };\n      const cEl = document.getElementById('preCount');\n      gsap.timeline()\n        .to('#preRule', { scaleX: 1, duration: 1.5, ease: 'power2.inOut' }, 0)\n        .to(cnt, {\n          v: 100, duration: 1.5, ease: 'power2.inOut',\n          onUpdate: () => { cEl.textContent = String(Math.round(cnt.v)).padStart(3, '0'); }\n        }, 0)\n        .to('#preCenter', { opacity: 0, duration: 0.3 }, 1.6)\n        .to('#preTop', { yPercent: -100, duration: 0.9, ease: EASE }, 1.75)\n        .to('#preBot', { yPercent: 100, duration: 0.9, ease: EASE }, 1.75)\n        .add(() => heroTl.play(), 1.9)\n        .set(pre, { display: 'none' });\n    } else {\n      if (pre) pre.style.display = 'none';\n      heroTl.play();\n    }\n\n    // scroll progress\n    gsap.to('#progressFill', { scaleX: 1, ease: 'none', scrollTrigger: { start: 0, end: 'max', scrub: 0.3 } });\n\n    // eyebrow rules (outside hero)\n    this.q('[data-eyebrow]').forEach(el => {\n      if (el.closest('#hero')) return;\n      const rule = el.querySelector('[data-eyebrow-rule]');\n      gsap.set(el, { opacity: 0 });\n      ST.create({\n        trigger: el, start: 'top 82%', once: true,\n        onEnter: () => {\n          gsap.to(el, { opacity: 1, duration: 0.9, ease: EASE });\n          if (rule) gsap.to(rule, { scaleX: 1, duration: 0.9, ease: EASE });\n        }\n      });\n    });\n\n    // metrics count-up\n    this.q('[data-metric]').forEach((block, i) => {\n      const num = block.querySelector('[data-count]');\n      const sym = block.querySelector('[data-sym]');\n      const rule = block.querySelector('[data-metric-rule]');\n      const target = parseFloat(num.getAttribute('data-count'));\n      gsap.set(sym, { opacity: 0 });\n      ST.create({\n        trigger: block, start: 'top 75%', once: true,\n        onEnter: () => {\n          if (rule) gsap.to(rule, { scaleY: 1, duration: 0.9, ease: EASE, delay: i * 0.06 });\n          const o = { v: 0 };\n          gsap.to(o, {\n            v: target, duration: 1.8, ease: 'power3.out', delay: i * 0.06,\n            onUpdate: () => { num.textContent = String(Math.round(o.v)); },\n            onComplete: () => gsap.to(sym, { opacity: 1, duration: 0.4 })\n          });\n        }\n      });\n    });\n\n    // experience: name mask wipes + line reveals + timeline fill\n    this.q('[data-exp-name]').forEach(el => {\n      gsap.set(el, { yPercent: 110 });\n      ST.create({ trigger: el, start: 'top 80%', once: true, onEnter: () => gsap.to(el, { yPercent: 0, duration: 0.9, ease: EASE }) });\n    });\n    this.q('[data-exp-line]').forEach(el => {\n      gsap.set(el, { y: 32, opacity: 0 });\n      ST.create({ trigger: el, start: 'top 88%', once: true, onEnter: () => gsap.to(el, { y: 0, opacity: 1, duration: 0.9, ease: EASE }) });\n    });\n    gsap.to('#expTimelineFill', { scaleY: 1, ease: 'none', scrollTrigger: { trigger: '#experience', start: 'top 60%', end: 'bottom 80%', scrub: 0.4 } });\n\n    // case studies: horizontal scroll on desktop\n    const track = document.getElementById('casesTrack');\n    const panels = this.q('[data-case]');\n    const mm = gsap.matchMedia();\n    mm.add('(min-width: 901px)', () => {\n      const total = panels.length;\n      const tween = gsap.to(track, {\n        xPercent: -100 * (total - 1) / total, ease: 'none',\n        scrollTrigger: { trigger: '#casesPin', pin: true, scrub: 0.6, end: () => '+=' + window.innerWidth * (total - 1), anticipatePin: 1 }\n      });\n      panels.forEach(p => {\n        const inner = p.querySelector('div[style*=\"max-width\"]');\n        gsap.set(p, { scale: 0.94, opacity: 0.55 });\n        ST.create({\n          trigger: p, containerAnimation: tween, start: 'left 65%', end: 'right 35%',\n          onToggle: self => {\n            gsap.to(p, { scale: self.isActive ? 1 : 0.94, opacity: self.isActive ? 1 : 0.55, duration: 0.7, ease: EASE });\n            if (self.isActive) this.focusPanel(p);\n          }\n        });\n      });\n      return () => gsap.set(panels, { scale: 1, opacity: 1 });\n    });\n    mm.add('(max-width: 900px)', () => {\n      panels.forEach(p => {\n        ST.create({ trigger: p, start: 'top 65%', once: true, onEnter: () => this.focusPanel(p) });\n      });\n    });\n\n    // capability drawer rows (hover devices only)\n    if (!touch) {\n      this.q('[data-row]').forEach(row => {\n        const fill = row.querySelector('[data-row-fill]');\n        const cat = row.querySelector('[data-row-cat]');\n        const tools = Array.from(row.querySelectorAll('[data-tool]'));\n        gsap.set(tools, { x: 40, opacity: 0 });\n        let open = false;\n        row.addEventListener('mouseenter', () => {\n          if (open) return; open = true;\n          gsap.to(fill, { scaleX: 1, duration: 0.5, ease: 'power3.out' });\n          gsap.to(cat, { color: '#FFFFFF', duration: 0.3 });\n          gsap.to(row, { paddingTop: 36, paddingBottom: 36, duration: 0.5, ease: EASE });\n          gsap.to(tools, { x: 0, opacity: 1, duration: 0.6, ease: EASE, stagger: 0.05, delay: 0.08 });\n          tools.forEach(t => { t.style.borderColor = 'rgba(255,255,255,0.35)'; t.style.color = '#FFFFFF'; });\n        });\n        row.addEventListener('mouseleave', () => {\n          open = false;\n          gsap.to(fill, { scaleX: 0, duration: 0.5, ease: 'power3.inOut', transformOrigin: 'right center', onComplete: () => gsap.set(fill, { transformOrigin: 'left center' }) });\n          gsap.to(cat, { color: '#0A1330', duration: 0.4, delay: 0.1 });\n          gsap.to(row, { paddingTop: 26, paddingBottom: 26, duration: 0.5, ease: EASE });\n          gsap.to(tools, { x: 40, opacity: 0, duration: 0.4, ease: 'power2.in' });\n          setTimeout(() => tools.forEach(t => { t.style.borderColor = 'rgba(10,19,48,0.12)'; t.style.color = '#0A1330'; }), 350);\n        });\n      });\n    } else {\n      gsap.set('[data-tool]', { x: 0, opacity: 1 });\n    }\n\n    // dark interlude colour interpolation\n    const inter = document.getElementById('interlude');\n    const interText = document.querySelector('[data-interlude-text]');\n    gsap.fromTo(inter, { backgroundColor: '#FFFFFF' }, {\n      backgroundColor: '#0A1330', ease: 'none',\n      scrollTrigger: { trigger: inter, start: 'top 85%', end: 'top 40%', scrub: true }\n    });\n    gsap.fromTo(interText, { color: '#0A1330' }, {\n      color: '#FFFFFF', ease: 'none',\n      scrollTrigger: { trigger: inter, start: 'top 85%', end: 'top 40%', scrub: true }\n    });\n\n    // footer: per-char hover lift on LET'S TALK\n    const lt = document.getElementById('letsTalk');\n    if (lt && !touch) {\n      const text = lt.textContent;\n      lt.textContent = '';\n      text.split('').forEach(ch => {\n        const s = document.createElement('span');\n        s.style.display = 'inline-block';\n        s.style.whiteSpace = 'pre';\n        s.textContent = ch;\n        s.addEventListener('mouseenter', () => {\n          gsap.to(s, { y: '-0.12em', color: 'rgba(255,255,255,0.6)', duration: 0.35, ease: EASE, overwrite: true, onComplete: () => gsap.to(s, { y: 0, color: '#FFFFFF', duration: 0.7, ease: EASE }) });\n        });\n        lt.appendChild(s);\n      });\n    }\n\n    // magnetic buttons\n    if (!touch && !mobile) {\n      this.q('[data-magnet]').forEach(btn => {\n        btn.addEventListener('mousemove', e => {\n          const r = btn.getBoundingClientRect();\n          const dx = e.clientX - (r.left + r.width / 2);\n          const dy = e.clientY - (r.top + r.height / 2);\n          gsap.to(btn, { x: dx * 0.25, y: dy * 0.35, duration: 0.4, ease: 'power2.out' });\n        });\n        btn.addEventListener('mouseleave', () => gsap.to(btn, { x: 0, y: 0, duration: 0.7, ease: 'elastic.out(1, 0.4)' }));\n      });\n    }\n\n    // marquee pause on hover\n    const mq = document.getElementById('toolMarquee');\n    if (mq) {\n      mq.parentElement.addEventListener('mouseenter', () => { mq.style.animationPlayState = 'paused'; });\n      mq.parentElement.addEventListener('mouseleave', () => { mq.style.animationPlayState = 'running'; });\n    }\n\n    // custom cursor\n    if (!touch && (this.props.customCursor ?? true)) {\n      const dot = document.getElementById('cursorDot');\n      const ring = document.getElementById('cursorRing');\n      const label = document.getElementById('cursorLabel');\n      let mx = innerWidth / 2, my = innerHeight / 2, rx = mx, ry = my;\n      window.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });\n      const loop = () => {\n        rx += (mx - rx) * 0.12; ry += (my - ry) * 0.12;\n        dot.style.transform = 'translate(' + mx + 'px,' + my + 'px)';\n        ring.style.transform = 'translate(' + rx + 'px,' + ry + 'px)';\n        this._raf = requestAnimationFrame(loop);\n      };\n      loop();\n      const setRing = (size, color, showLabel) => {\n        gsap.to(ring, { width: size, height: size, marginLeft: -size / 2, marginTop: -size / 2, borderColor: color, duration: 0.35, ease: EASE });\n        gsap.to(label, { opacity: showLabel ? 1 : 0, duration: 0.25 });\n      };\n      document.addEventListener('mouseover', e => {\n        if (e.target.closest('[data-case]')) setRing(90, '#0A1330', true);\n        else if (e.target.closest('a, [data-hover], [data-row]')) setRing(64, '#0A1330', false);\n        else setRing(36, '#0A1330', false);\n      });\n    } else {\n      const dot = document.getElementById('cursorDot'), ring = document.getElementById('cursorRing');\n      if (dot) dot.style.display = 'none';\n      if (ring) ring.style.display = 'none';\n    }\n\n    ST.refresh();\n  }\n  focusPanel(p) {\n    const gsap = window.gsap;\n    const chips = Array.from(p.querySelectorAll('[data-chip]'));\n    if (!p._chipsShown) {\n      p._chipsShown = true;\n      gsap.fromTo(chips, { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: 'expo.out', stagger: 0.06 });\n    }\n    const rev = p.querySelector('[data-rev]');\n    if (rev && !rev._done) {\n      rev._done = true;\n      const from = parseFloat(rev.getAttribute('data-rev-from'));\n      const to = parseFloat(rev.getAttribute('data-rev-to'));\n      const pre = rev.getAttribute('data-rev-prefix') || '';\n      const suf = rev.getAttribute('data-rev-suffix') || '';\n      const o = { v: from };\n      gsap.to(o, {\n        v: to, duration: 1.6, ease: 'power3.out',\n        onUpdate: () => { rev.textContent = pre + Math.round(o.v) + suf; }\n      });\n    }\n  }\n  initReduced() {\n    // reduced motion: everything visible, opacity-only, no counters/pins/cursor\n    ['cursorDot', 'cursorRing'].forEach(id => { const el = document.getElementById(id); if (el) el.style.display = 'none'; });\n  }\n  renderVals() { return {}; }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
